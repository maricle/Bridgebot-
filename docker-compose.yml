services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bridgebot
      POSTGRES_PASSWORD: bridgebot
      POSTGRES_DB: bridgebot
    ports:
      - "5432:5432"
    volumes:
      - bridgebot_pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql

volumes:
  bridgebot_pgdata:
