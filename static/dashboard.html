<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BridgeBot Dashboard — Grupo Ideas</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --accent: #4f46e5;
    --green:  #10b981;
    --amber:  #f59e0b;
    --red:    #ef4444;
    --bg:     #f1f5f9;
    --card:   #ffffff;
    --text:   #1e293b;
    --muted:  #64748b;
    --border: #e2e8f0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }

  header {
    background: var(--accent);
    color: white;
    padding: 1rem 2rem;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 1rem;
  }
  header h1 { font-size: 1.25rem; font-weight: 700; flex: 1; min-width: 200px; }

  .tabs {
    display: flex;
    gap: .25rem;
    background: rgba(255,255,255,.15);
    border-radius: 8px;
    padding: .3rem;
  }
  .tab-btn {
    background: transparent;
    color: rgba(255,255,255,.8);
    border: none;
    border-radius: 6px;
    padding: .4rem 1rem;
    font-size: .9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s;
  }
  .tab-btn.active, .tab-btn:hover {
    background: white;
    color: var(--accent);
  }

  .filtro {
    display: flex;
    align-items: center;
    gap: .5rem;
    flex-wrap: wrap;
  }
  .filtro label { font-size: .85rem; opacity: .9; }
  .filtro input[type=date] {
    padding: .35rem .6rem;
    border-radius: 6px;
    border: none;
    font-size: .9rem;
    color: var(--text);
  }
  .filtro button, .btn {
    background: white;
    color: var(--accent);
    border: none;
    border-radius: 6px;
    padding: .4rem 1.1rem;
    font-weight: 700;
    font-size: .9rem;
    cursor: pointer;
    transition: opacity .15s;
  }
  .filtro button:hover, .btn:hover { opacity: .85; }

  main { padding: 1.5rem 2rem; max-width: 1300px; margin: 0 auto; }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ── ANALYTICS ── */
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 1rem;
    margin-bottom: 1.5rem;
  }
  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 1.2rem 1.4rem;
    box-shadow: 0 1px 4px rgba(0,0,0,.07);
    border-top: 4px solid var(--accent);
  }
  .card.green { border-top-color: var(--green); }
  .card.amber { border-top-color: var(--amber); }
  .card .label {
    font-size: .72rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .06em;
    font-weight: 600;
  }
  .card .value {
    font-size: 2.4rem;
    font-weight: 800;
    color: var(--accent);
    line-height: 1.1;
    margin-top: .3rem;
  }
  .card.green .value { color: var(--green); }
  .card.amber .value { color: var(--amber); }
  .card .sub { font-size: .82rem; color: var(--muted); margin-top: .25rem; }

  .charts {
    display: grid;
    grid-template-columns: 3fr 2fr;
    gap: 1.5rem;
  }
  .chart-box {
    background: var(--card);
    border-radius: 12px;
    padding: 1.3rem 1.5rem;
    box-shadow: 0 1px 4px rgba(0,0,0,.07);
  }
  .chart-box h2 {
    font-size: .95rem;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .05em;
    margin-bottom: 1rem;
  }

  /* ── HISTORIAL ── */
  .search-bar {
    display: flex;
    gap: .75rem;
    margin-bottom: 1.5rem;
    align-items: center;
    flex-wrap: wrap;
  }
  .search-bar input {
    flex: 1;
    min-width: 220px;
    max-width: 380px;
    padding: .6rem 1rem;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    font-size: 1rem;
    color: var(--text);
    outline: none;
    transition: border-color .15s;
  }
  .search-bar input:focus { border-color: var(--accent); }
  .search-bar .btn-primary {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: .6rem 1.4rem;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
  }
  .search-bar .btn-primary:hover { opacity: .88; }

  .cliente-info {
    background: var(--card);
    border-radius: 12px;
    padding: 1rem 1.4rem;
    margin-bottom: 1rem;
    box-shadow: 0 1px 4px rgba(0,0,0,.07);
    display: flex;
    gap: 2rem;
    flex-wrap: wrap;
  }
  .cliente-info .ci-item { font-size: .9rem; }
  .cliente-info .ci-label { color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; }
  .cliente-info .ci-val { font-weight: 600; margin-top: .1rem; }

  .conversacion {
    background: var(--card);
    border-radius: 12px;
    padding: 1.2rem 1.4rem;
    box-shadow: 0 1px 4px rgba(0,0,0,.07);
    max-height: 60vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: .6rem;
  }
  .msg {
    max-width: 75%;
    padding: .6rem .9rem;
    border-radius: 12px;
    font-size: .9rem;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-start;
    background: #f0f4ff;
    border-bottom-left-radius: 4px;
  }
  .msg.assistant {
    align-self: flex-end;
    background: #edfdf6;
    border-bottom-right-radius: 4px;
  }
  .msg .msg-meta {
    font-size: .7rem;
    color: var(--muted);
    margin-top: .3rem;
  }

  /* ── ARCHIVOS ── */
  .tabla-wrap {
    background: var(--card);
    border-radius: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,.07);
    overflow: hidden;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: .88rem;
  }
  thead {
    background: var(--bg);
    border-bottom: 1.5px solid var(--border);
  }
  th {
    padding: .75rem 1rem;
    text-align: left;
    font-size: .72rem;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .06em;
  }
  td {
    padding: .7rem 1rem;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #f8fafc; }

  .badge {
    display: inline-block;
    padding: .2rem .6rem;
    border-radius: 20px;
    font-size: .75rem;
    font-weight: 700;
  }
  .badge.wa   { background: #dcfce7; color: #166534; }
  .badge.ig   { background: #fce7f3; color: #9d174d; }
  .badge.img  { background: #ede9fe; color: #5b21b6; }
  .badge.doc  { background: #fef3c7; color: #92400e; }
  .badge.audio { background: #e0f2fe; color: #0c4a6e; }

  .dl-btn {
    background: var(--accent);
    color: white;
    text-decoration: none;
    padding: .25rem .7rem;
    border-radius: 6px;
    font-size: .8rem;
    font-weight: 600;
    white-space: nowrap;
  }
  .dl-btn:hover { opacity: .85; }
  .no-url { color: var(--muted); font-size: .8rem; }

  .estado {
    font-size: .85rem;
    color: var(--muted);
    margin-bottom: 1rem;
    min-height: 1.2rem;
  }
  .empty { color: var(--muted); text-align: center; padding: 2.5rem; }

  .mode-toggle {
    display: flex;
    gap: 0;
    border-radius: 8px;
    overflow: hidden;
    border: 1.5px solid var(--border);
  }
  .mode-btn {
    background: white;
    color: var(--muted);
    border: none;
    padding: .45rem 1rem;
    font-size: .85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s;
  }
  .mode-btn.active { background: var(--accent); color: white; }
  .mode-btn:not(.active):hover { background: var(--bg); }

  .resultados-lista {
    display: flex;
    flex-direction: column;
    gap: .5rem;
    margin-bottom: 1rem;
  }
  .resultado-card {
    background: var(--card);
    border-radius: 10px;
    padding: .8rem 1.2rem;
    box-shadow: 0 1px 3px rgba(0,0,0,.07);
    display: flex;
    align-items: center;
    gap: 1rem;
    cursor: pointer;
    border: 1.5px solid transparent;
    transition: border-color .15s;
  }
  .resultado-card:hover { border-color: var(--accent); }
  .resultado-card .rc-nombre { font-weight: 700; font-size: .95rem; }
  .resultado-card .rc-tel { font-size: .82rem; color: var(--muted); }
  .resultado-card .rc-fecha { margin-left: auto; font-size: .78rem; color: var(--muted); white-space: nowrap; }

  .reply-box {
    display: flex;
    gap: .75rem;
    margin-top: 1rem;
    align-items: flex-end;
  }
  .reply-box textarea {
    flex: 1;
    padding: .65rem 1rem;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    font-size: .95rem;
    font-family: inherit;
    color: var(--text);
    resize: none;
    min-height: 48px;
    max-height: 140px;
    outline: none;
    transition: border-color .15s;
  }
  .reply-box textarea:focus { border-color: var(--accent); }
  .reply-box .btn-send {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: .6rem 1.4rem;
    font-weight: 700;
    font-size: .95rem;
    cursor: pointer;
    white-space: nowrap;
    height: 48px;
  }
  .reply-box .btn-send:disabled { opacity: .5; cursor: default; }
  .reply-box .btn-send:not(:disabled):hover { opacity: .88; }

  @media (max-width: 800px) {
    main { padding: 1rem; }
    .charts { grid-template-columns: 1fr; }
    header { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>

<header>
  <h1>BridgeBot &mdash; Grupo Ideas</h1>
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('analytics')">Analytics</button>
    <button class="tab-btn" onclick="switchTab('historial')">Historial</button>
    <button class="tab-btn" onclick="switchTab('archivos')">Archivos</button>
  </div>
  <div class="filtro" id="filtro-analytics">
    <label>Desde</label>
    <input type="date" id="desde">
    <label>Hasta</label>
    <input type="date" id="hasta">
    <button onclick="cargarAnalytics()">Aplicar</button>
  </div>
</header>

<main>

  <!-- ── ANALYTICS ── -->
  <div class="tab-panel active" id="panel-analytics">
    <p class="estado" id="estado-analytics">Cargando...</p>
    <div class="cards">
      <div class="card">
        <div class="label">Clientes atendidos</div>
        <div class="value" id="c-total">—</div>
        <div class="sub" id="c-periodo">en el período</div>
      </div>
      <div class="card green">
        <div class="label">Consultaron precio</div>
        <div class="value" id="c-pct">—</div>
        <div class="sub" id="c-precio-n">— clientes</div>
      </div>
      <div class="card amber">
        <div class="label">Leads generados</div>
        <div class="value" id="c-leads">—</div>
        <div class="sub" id="c-conv">conversión sobre atendidos</div>
      </div>
    </div>
    <div class="charts">
      <div class="chart-box">
        <h2>Clientes por día</h2>
        <canvas id="chartDia"></canvas>
      </div>
      <div class="chart-box">
        <h2>Productos más consultados</h2>
        <canvas id="chartProd"></canvas>
      </div>
    </div>
  </div>

  <!-- ── HISTORIAL ── -->
  <div class="tab-panel" id="panel-historial">
    <div class="search-bar">
      <div class="mode-toggle">
        <button class="mode-btn active" id="mode-tel" onclick="setMode('tel')">Por teléfono</button>
        <button class="mode-btn" id="mode-txt" onclick="setMode('txt')">Por contenido</button>
      </div>
      <input type="tel"  id="input-telefono" placeholder="Número de teléfono (ej: 3794000000)"
             onkeydown="if(event.key==='Enter') buscarHistorial()">
      <input type="text" id="input-contenido" placeholder="Buscar en conversaciones (ej: estado de pedido)"
             style="display:none"
             onkeydown="if(event.key==='Enter') buscarContenido()">
      <button class="btn-primary" id="btn-buscar" onclick="ejecutarBusqueda()">Buscar</button>
    </div>
    <p class="estado" id="estado-historial"></p>
    <div id="lista-resultados" style="display:none"></div>
    <div id="resultado-historial"></div>
    <div class="reply-box" id="reply-box" style="display:none">
      <textarea id="reply-texto" placeholder="Escribir respuesta por WhatsApp..."
                rows="1" oninput="autoResize(this)"
                onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();enviarRespuesta()}"></textarea>
      <button class="btn-send" id="btn-send" onclick="enviarRespuesta()">Enviar</button>
    </div>
  </div>

  <!-- ── ARCHIVOS ── -->
  <div class="tab-panel" id="panel-archivos">
    <div class="search-bar" style="margin-bottom:1rem">
      <input type="tel" id="filtro-tel-archivos" placeholder="Filtrar por teléfono..."
             oninput="filtrarArchivos()">
    </div>
    <p class="estado" id="estado-archivos">Cargando archivos...</p>
    <div class="tabla-wrap">
      <table>
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Canal</th>
            <th>Tipo</th>
            <th>Cliente</th>
            <th>Teléfono / ID</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody id="tabla-archivos">
          <tr><td colspan="6" class="empty">Cargando...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</main>

<script>
let chartDia = null, chartProd = null;

// ── TABS ──────────────────────────────────────────────────────────────────────
function switchTab(tab) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-' + tab).classList.add('active');
  event.target.classList.add('active');
  document.getElementById('filtro-analytics').style.display = tab === 'analytics' ? 'flex' : 'none';
  if (tab === 'archivos') cargarArchivos();
}

// ── ANALYTICS ─────────────────────────────────────────────────────────────────
function hoy() { return new Date().toISOString().split('T')[0]; }
function haceDias(n) {
  const d = new Date(); d.setDate(d.getDate() - n);
  return d.toISOString().split('T')[0];
}

async function cargarAnalytics() {
  const desde = document.getElementById('desde').value;
  const hasta = document.getElementById('hasta').value;
  document.getElementById('estado-analytics').textContent = 'Cargando...';
  try {
    const res = await fetch(`/analytics?desde=${desde}&hasta=${hasta}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const d = await res.json();

    document.getElementById('estado-analytics').textContent = `Período: ${desde} → ${hasta}`;
    document.getElementById('c-total').textContent  = d.total_clientes;
    document.getElementById('c-pct').textContent    = d.precio.porcentaje + '%';
    document.getElementById('c-precio-n').textContent = d.precio.cantidad + ' clientes';
    document.getElementById('c-leads').textContent  = d.total_leads;
    const conv = d.total_clientes
      ? Math.round(d.total_leads / d.total_clientes * 100) + '%' : '—';
    document.getElementById('c-conv').textContent = conv + ' de conversión';

    const dias    = d.clientes_por_dia.map(x => x.dia);
    const totales = d.clientes_por_dia.map(x => x.total);
    if (chartDia) chartDia.destroy();
    chartDia = new Chart(document.getElementById('chartDia'), {
      type: 'bar',
      data: {
        labels: dias,
        datasets: [{ label: 'Clientes', data: totales,
          backgroundColor: 'rgba(79,70,229,.25)', borderColor: '#4f46e5',
          borderWidth: 2, borderRadius: 5 }]
      },
      options: { responsive: true, plugins: { legend: { display: false } },
        scales: { y: { beginAtZero: true, ticks: { stepSize: 1, precision: 0 } },
                  x: { ticks: { maxRotation: 45 } } } }
    });

    const prods = d.productos.slice(0, 12);
    if (chartProd) chartProd.destroy();
    chartProd = new Chart(document.getElementById('chartProd'), {
      type: 'bar',
      data: {
        labels: prods.map(x => x.producto),
        datasets: [{ label: 'Clientes', data: prods.map(x => x.clientes),
          backgroundColor: 'rgba(16,185,129,.25)', borderColor: '#10b981',
          borderWidth: 2, borderRadius: 5 }]
      },
      options: { indexAxis: 'y', responsive: true, plugins: { legend: { display: false } },
        scales: { x: { beginAtZero: true, ticks: { stepSize: 1, precision: 0 } } } }
    });
  } catch (e) {
    document.getElementById('estado-analytics').textContent = 'Error: ' + e.message;
  }
}

// ── HISTORIAL ─────────────────────────────────────────────────────────────────
let _modoHistorial = 'tel';

function setMode(modo) {
  _modoHistorial = modo;
  document.getElementById('mode-tel').classList.toggle('active', modo === 'tel');
  document.getElementById('mode-txt').classList.toggle('active', modo === 'txt');
  document.getElementById('input-telefono').style.display = modo === 'tel' ? '' : 'none';
  document.getElementById('input-contenido').style.display = modo === 'txt' ? '' : 'none';
  document.getElementById('estado-historial').textContent = '';
  document.getElementById('lista-resultados').style.display = 'none';
  document.getElementById('lista-resultados').innerHTML = '';
  document.getElementById('resultado-historial').innerHTML = '';
  document.getElementById('reply-box').style.display = 'none';
}

function ejecutarBusqueda() {
  if (_modoHistorial === 'tel') buscarHistorial();
  else buscarContenido();
}

async function buscarContenido() {
  const q = document.getElementById('input-contenido').value.trim();
  if (!q) return;
  const estado = document.getElementById('estado-historial');
  const lista  = document.getElementById('lista-resultados');
  document.getElementById('resultado-historial').innerHTML = '';
  document.getElementById('reply-box').style.display = 'none';
  estado.textContent = 'Buscando...';
  lista.style.display = 'none';
  try {
    const res = await fetch(`/buscar-contenido?q=${encodeURIComponent(q)}`);
    const data = await res.json();
    if (!data.length) {
      estado.textContent = `Sin conversaciones con "${q}".`;
      return;
    }
    estado.textContent = `${data.length} conversación(es) contienen "${q}". Hacé clic para ver.`;
    lista.style.display = 'block';
    lista.innerHTML = '<div class="resultados-lista">' + data.map(r => {
      const nombre = escHtml(r.nombre || '—');
      const tel    = escHtml(r.telefono || r.ig_user_id || '—');
      const fecha  = (r.ultimo_mensaje || '').substring(0, 16).replace('T', ' ');
      const canal  = r.canal === 'whatsapp' ? '<span class="badge wa">WA</span>'
                   : r.canal === 'instagram' ? '<span class="badge ig">IG</span>' : '';
      return `<div class="resultado-card" onclick='cargarConversacionDirecta(${JSON.stringify(r.ig_user_id)})'>
        ${canal}
        <div>
          <div class="rc-nombre">${nombre}</div>
          <div class="rc-tel">${tel}</div>
        </div>
        <div class="rc-fecha">${fecha}</div>
      </div>`;
    }).join('') + '</div>';
  } catch (e) {
    estado.textContent = 'Error: ' + e.message;
  }
}

async function cargarConversacionDirecta(userId) {
  const estado = document.getElementById('estado-historial');
  estado.textContent = 'Cargando conversación...';
  try {
    const res = await fetch(`/conversacion/${encodeURIComponent(userId)}`);
    const d = await res.json();
    _currentUserId = d.user_id;
    const c = d.cliente;
    const esWA = (c.canal === 'whatsapp') || (!c.canal && /^\d{10,15}$/.test(d.user_id));
    estado.textContent = '';
    document.getElementById('resultado-historial').innerHTML = `
      <div class="cliente-info">
        <div class="ci-item"><div class="ci-label">Nombre</div><div class="ci-val">${c.nombre || '—'}</div></div>
        <div class="ci-item"><div class="ci-label">Teléfono</div><div class="ci-val">${c.telefono || d.user_id}</div></div>
        <div class="ci-item"><div class="ci-label">Canal</div><div class="ci-val">${c.canal || '—'}</div></div>
      </div>
      <div class="conversacion" id="conv-box">
        ${d.historial.length === 0
          ? '<span class="empty">Sin mensajes registrados.</span>'
          : d.historial.map(m => `
            <div class="msg ${m.rol}">
              ${escHtml(m.contenido)}
              <div class="msg-meta">${m.creado_en || ''}</div>
            </div>`).join('')}
      </div>`;
    const box = document.getElementById('conv-box');
    if (box) box.scrollTop = box.scrollHeight;
    document.getElementById('reply-box').style.display = esWA ? 'flex' : 'none';
  } catch(e) {
    estado.textContent = 'Error: ' + e.message;
  }
}

async function buscarHistorial() {
  const tel = document.getElementById('input-telefono').value.trim();
  if (!tel) return;
  const estado = document.getElementById('estado-historial');
  const result = document.getElementById('resultado-historial');
  estado.textContent = 'Buscando...';
  result.innerHTML = '';
  try {
    const res = await fetch(`/buscar?telefono=${encodeURIComponent(tel)}`);
    const d = await res.json();
    if (!d.encontrado) {
      estado.textContent = `No se encontró ningún usuario con el teléfono "${tel}".`;
      return;
    }
    estado.textContent = '';
    _currentUserId = d.user_id;
    const c = d.cliente;
    const esWA = (c.canal === 'whatsapp') || (!c.canal && /^\d{10,15}$/.test(d.user_id));
    result.innerHTML = `
      <div class="cliente-info">
        <div class="ci-item">
          <div class="ci-label">Nombre</div>
          <div class="ci-val">${c.nombre || '—'}</div>
        </div>
        <div class="ci-item">
          <div class="ci-label">Teléfono</div>
          <div class="ci-val">${c.telefono || d.user_id}</div>
        </div>
        <div class="ci-item">
          <div class="ci-label">Email</div>
          <div class="ci-val">${c.email || '—'}</div>
        </div>
        <div class="ci-item">
          <div class="ci-label">Canal</div>
          <div class="ci-val">${c.canal || '—'}</div>
        </div>
      </div>
      <div class="conversacion" id="conv-box">
        ${d.historial.length === 0
          ? '<span class="empty">Sin mensajes registrados.</span>'
          : d.historial.map(m => `
            <div class="msg ${m.rol}">
              ${escHtml(m.contenido)}
              <div class="msg-meta">${m.creado_en || ''}</div>
            </div>`).join('')}
      </div>`;
    const box = document.getElementById('conv-box');
    if (box) box.scrollTop = box.scrollHeight;
    document.getElementById('reply-box').style.display = esWA ? 'flex' : 'none';
    document.getElementById('reply-texto').value = '';
  } catch (e) {
    estado.textContent = 'Error: ' + e.message;
  }
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 140) + 'px';
}

let _currentUserId = null;

async function enviarRespuesta() {
  const texto = document.getElementById('reply-texto').value.trim();
  if (!texto || !_currentUserId) return;
  const btn = document.getElementById('btn-send');
  btn.disabled = true;
  btn.textContent = 'Enviando...';
  try {
    const res = await fetch('/responder', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user_id: _currentUserId, mensaje: texto }),
    });
    if (!res.ok) {
      const err = await res.json();
      alert('Error: ' + (err.detail || res.status));
      return;
    }
    // Agregar el mensaje a la conversación visualmente
    const box = document.getElementById('conv-box');
    if (box) {
      const div = document.createElement('div');
      div.className = 'msg assistant';
      div.innerHTML = escHtml(texto) + '<div class="msg-meta">ahora</div>';
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }
    document.getElementById('reply-texto').value = '';
    document.getElementById('reply-texto').style.height = 'auto';
  } catch (e) {
    alert('Error: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Enviar';
  }
}

// ── ARCHIVOS ──────────────────────────────────────────────────────────────────
let _archivosData = [];

async function cargarArchivos() {
  const estado = document.getElementById('estado-archivos');
  estado.textContent = 'Cargando archivos...';
  try {
    const res = await fetch('/archivos');
    _archivosData = await res.json();
    filtrarArchivos();
  } catch (e) {
    estado.textContent = 'Error: ' + e.message;
    document.getElementById('tabla-archivos').innerHTML =
      '<tr><td colspan="6" class="empty">Error cargando datos.</td></tr>';
  }
}

function filtrarArchivos() {
  const filtro = (document.getElementById('filtro-tel-archivos').value || '').trim();
  const estado = document.getElementById('estado-archivos');
  const tbody  = document.getElementById('tabla-archivos');

  const datos = filtro
    ? _archivosData.filter(a => {
        const tel = (a.telefono || a.ig_user_id || '');
        return tel.includes(filtro);
      })
    : _archivosData;

  if (!datos.length) {
    tbody.innerHTML = `<tr><td colspan="6" class="empty">${
      filtro ? 'Sin archivos para ese teléfono.' : 'No hay archivos recibidos.'
    }</td></tr>`;
    estado.textContent = filtro ? `0 resultados para "${filtro}"` : '';
    return;
  }

  estado.textContent = `${datos.length} archivo(s)${filtro ? ` para "${filtro}"` : ''}.`;
  tbody.innerHTML = datos.map(a => {
    const canal = a.canal === 'whatsapp'  ? '<span class="badge wa">WA</span>'
                : a.canal === 'instagram' ? '<span class="badge ig">IG</span>'
                : a.canal;
    const tipoBadge = /image|foto|imagen/.test(a.tipo)
                  ? `<span class="badge img">${a.tipo}</span>`
                  : /audio/.test(a.tipo)
                  ? `<span class="badge audio">${a.tipo}</span>`
                  : `<span class="badge doc">${a.tipo}</span>`;
    const accion = (a.media_id || a.url)
      ? `<a class="dl-btn" href="/archivos/${a.id}/descargar">Descargar</a>`
      : `<span class="no-url">—</span>`;
    const nombre   = escHtml(a.nombre || '—');
    const telefono = escHtml(a.telefono || a.ig_user_id || '—');
    const fecha    = (a.creado_en || '').replace('T', ' ').substring(0, 16);
    return `<tr>
      <td>${fecha}</td>
      <td>${canal}</td>
      <td>${tipoBadge}</td>
      <td>${nombre}</td>
      <td style="font-size:.82rem;color:var(--muted)">${telefono}</td>
      <td>${accion}</td>
    </tr>`;
  }).join('');
}

document.getElementById('desde').value = haceDias(30);
document.getElementById('hasta').value = hoy();
cargarAnalytics();
</script>
